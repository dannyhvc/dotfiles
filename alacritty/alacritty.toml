[window]
decorations = "none"
startup_mode = "Maximized"

[terminal.shell]
# To launch Zellij directly, it must be the program. 
# You can't have both 'nu' and 'zellij' as the primary program.
program = "/home/dherrera/.cargo/bin/zellij"

[font]
size = 12.0

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"
