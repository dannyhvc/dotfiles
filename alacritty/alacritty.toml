[window]
decorations = "none"
startup_mode = "Maximized"

[terminal.shell]
# To launch Zellij directly, it must be the program. 
# You can't have both 'nu' and 'zellij' as the primary program.
# change to <USERNAME> when editing
program = "zellij"

[font]
size = 12.0
normal = { family = "Hack Nerd Font", style = "Regular" }
bold = { family = "Hack Nerd Font", style = "Bold" }
italic = { family = "Hack Nerd Font", style = "Italic" }
# bold-italic = { family = "Hack Nerd Font", style = "Bold Italic" }
